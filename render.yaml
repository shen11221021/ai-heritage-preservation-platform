services:
  - type: web
    name: ai-heritage-preservation-platform
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: HERITAGE_HOST
        value: 0.0.0.0
      - key: HERITAGE_PORT
        value: 8080
      - key: HERITAGE_DB_PATH
        value: /tmp/heritage.db
      - key: HERITAGE_PUBLIC_URL
        sync: false
      - key: HERITAGE_BASIC_USER
        sync: false
      - key: HERITAGE_BASIC_PASSWORD
        sync: false
      - key: HERITAGE_LLM_PROVIDER
        value: ollama
      - key: HERITAGE_LLM_ENDPOINT
        sync: false
      - key: HERITAGE_LLM_MODEL
        sync: false
      - key: HERITAGE_LLM_API_KEY
        sync: false
